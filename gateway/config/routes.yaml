# Gateway routing config. Path -> upstream mapping, loaded at boot and hot-reloaded
# on edit (see src/config/configStore.ts). This file is the source of truth for
# rate-limit tiers and for which upstream (or upstream version) each path proxies to.

tiers:
  free:
    requestsPerSecond: 5
    burst: 10
  pro:
    # Generous on purpose: this tier is what the Go load-test tool hits to
    # demonstrate the gateway's own throughput ceiling, not the limiter's.
    requestsPerSecond: 2000
    burst: 3000

routes:
  - path: /api/users
    upstream: http://mock-users:4001
    auth: required
    tier: free

  - path: /api/orders
    auth: required
    tier: pro
    versions:
      v1: http://mock-orders-v1:4002
      v2: http://mock-orders-v2:4003
    activeVersion: v1
    rollback:
      enabled: true
      errorThreshold: 0.5
      windowSize: 50
