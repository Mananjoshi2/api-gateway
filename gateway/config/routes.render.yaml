# Same routing/tiers as routes.yaml, but upstream hosts are ${VAR}
# placeholders resolved at boot from env vars set in the repo root
# render.yaml. Values are the mocks' public *.onrender.com URLs -- Render's
# free web services can't receive private-network traffic, so plain HTTPS to
# their public URL is what actually works on the free plan (see render.yaml
# comments for the full explanation).

tiers:
  free:
    requestsPerSecond: 5
    burst: 10
  pro:
    requestsPerSecond: 2000
    burst: 3000

routes:
  - path: /api/users
    upstream: ${MOCK_USERS_URL}
    auth: required
    tier: free

  - path: /api/orders
    auth: required
    tier: pro
    versions:
      v1: ${MOCK_ORDERS_V1_URL}
      v2: ${MOCK_ORDERS_V2_URL}
    activeVersion: v1
    rollback:
      enabled: true
      errorThreshold: 0.5
      windowSize: 50
